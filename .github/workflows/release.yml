name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Visual Studio C++ toolchain
        id: native-toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'vswhere.exe was not found on the Windows runner.'
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -requiresAny Microsoft.VisualStudio.Component.Windows10SDK.19041,Microsoft.VisualStudio.Component.Windows11SDK.26100 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw 'The Visual Studio C++ x86/x64 toolchain is not installed.'
          }
          $msbuild = Join-Path $installation 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild)) {
            throw "MSBuild was not found under the selected Visual Studio installation: $msbuild"
          }
          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build native TSF TIP
        shell: pwsh
        run: |
          & '${{ steps.native-toolchain.outputs.path }}' `
            '${{ github.workspace }}\src\Infrastructure\EasyChat.Infrastructure.Windows\Native\Tsf\EasyChat.Tsf.Native.vcxproj' `
            /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native TSF DLL
        shell: pwsh
        run: |
          $dll = Join-Path '${{ github.workspace }}' 'src\Infrastructure\EasyChat.Infrastructure.Windows\Native\Tsf\bin\Release\EasyChat.Tsf.Native.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "Native TSF build did not produce the expected DLL: $dll"
          }

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Restore Windows dependencies
        run: dotnet restore ./src/Host/EasyChat.Desktop.Windows/EasyChat.Desktop.Windows.csproj -r win-x64 -p:SelfContained=true

      - name: Publish EasyChat
        # Keep ReadyToRun disabled. It adds about 19.6 MiB to the trimmed MSI
        # and should only be enabled after a cold-start benchmark proves its value.
        run: dotnet publish ./src/Host/EasyChat.Desktop.Windows/EasyChat.Desktop.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -o ./publish

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Used Tag Version: $VERSION"
          else
            VERSION=$(dotnet msbuild src/Host/EasyChat.Desktop.Windows/EasyChat.Desktop.Windows.csproj -getProperty:Version)
            echo "Used CSPROJ Version: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Previous Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p Releases

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PREVIOUS_TAG=$(git describe --tags --match 'v*.*.*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          else
            PREVIOUS_TAG=$(git describe --tags --match 'v*.*.*' --abbrev=0 HEAD 2>/dev/null || true)
            if [[ "${PREVIOUS_TAG#v}" == "${VERSION}" ]]; then
              PREVIOUS_TAG=$(git describe --tags --match 'v*.*.*' --abbrev=0 "${PREVIOUS_TAG}^" 2>/dev/null || true)
            fi
          fi

          if [[ -z "${PREVIOUS_TAG}" ]]; then
            echo "No previous release tag found; this release will establish the delta baseline."
            {
              echo "PREVIOUS_TAG="
              echo "EXPECT_WIN_DELTA=false"
            } >> "${GITHUB_ENV}"
            exit 0
          fi

          echo "Downloading full packages from previous release ${PREVIOUS_TAG}."
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          gh release download "${PREVIOUS_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "EasyChat-${PREVIOUS_VERSION}-full.nupkg" \
            --dir ./Releases

          WIN_BASE="./Releases/EasyChat-${PREVIOUS_VERSION}-full.nupkg"
          if [[ ! -f "${WIN_BASE}" ]]; then
            echo "::error::Previous release ${PREVIOUS_TAG} does not contain ${WIN_BASE##*/}."
            exit 1
          fi

          {
            echo "PREVIOUS_TAG=${PREVIOUS_TAG}"
            echo "EXPECT_WIN_DELTA=true"
          } >> "${GITHUB_ENV}"

      - name: Pack Velopack win channel
        run: |
          # Velopack 1.2.0 maps msiBanner to the dialog image and msiLogo to the top banner.
          # PerMachine makes the MSI a machine-wide installer and requests UAC elevation on launch.
          # https://docs.velopack.io/packaging/installer#install-location
          vpk pack -u EasyChat -v ${{ env.VERSION }} -p ./publish -e EasyChat.exe -c win -o ./Releases --msi true --instLocation PerMachine -i ./src/Host/EasyChat.Desktop/Assets/easychat-logo.ico --msiBanner ./.github/assets/installer/msi-dialog.bmp --msiLogo ./.github/assets/installer/msi-banner.bmp

      - name: Verify Velopack update packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $channels = @([pscustomobject]@{
            Name = 'win'
            Full = "EasyChat-$version-full.nupkg"
            Delta = "EasyChat-$version-delta.nupkg"
            ExpectDelta = $env:EXPECT_WIN_DELTA -eq 'true'
          })

          foreach ($channel in $channels) {
            $fullPath = Join-Path ./Releases $channel.Full
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              throw "Expected full package was not generated: $fullPath"
            }

            $feedPath = Join-Path ./Releases "releases.$($channel.Name).json"
            if (-not (Test-Path -LiteralPath $feedPath -PathType Leaf)) {
              throw "Expected release feed was not generated: $feedPath"
            }

            $feed = Get-Content -LiteralPath $feedPath -Raw | ConvertFrom-Json
            $currentAssets = @($feed.Assets | Where-Object { "$($_.Version)" -eq $version })
            if (-not ($currentAssets | Where-Object { $_.Type -eq 'Full' -and $_.FileName -eq $channel.Full })) {
              throw "Release feed $feedPath does not contain full package $($channel.Full)."
            }

            if ($channel.ExpectDelta) {
              $deltaPath = Join-Path ./Releases $channel.Delta
              if (-not (Test-Path -LiteralPath $deltaPath -PathType Leaf)) {
                throw "Expected delta package was not generated: $deltaPath"
              }

              if (-not ($currentAssets | Where-Object { $_.Type -eq 'Delta' -and $_.FileName -eq $channel.Delta })) {
                throw "Release feed $feedPath does not contain delta package $($channel.Delta)."
              }
            }
          }

      - name: Remove EXE installer packages
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath ./Releases -Filter '*Setup.exe' -File |
            Remove-Item -Force

      - name: Customize and verify MSI packages
        shell: pwsh
        run: |
          Get-ChildItem ./Releases/*.msi | ForEach-Object {
            ./.github/scripts/customize-velopack-msi.ps1 -Path $_.FullName
          }

      - name: Add channel and version to MSI file names
        shell: pwsh
        run: |
          $names = @{
            'EasyChat-win.msi' = "EasyChat-Win-${{ env.VERSION }}-Setup.msi"
          }

          foreach ($entry in $names.GetEnumerator()) {
            $source = Join-Path ./Releases $entry.Key
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Expected MSI was not generated: $source"
            }

            Rename-Item -LiteralPath $source -NewName $entry.Value
          }

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/scripts/generate-release-notes.ps1
          -Repository "${{ github.repository }}"
          -Tag "${{ github.ref_name }}"
          -OutputPath "artifacts/release-notes.md"
          -ExistingBody ([string]::Empty)

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          body_path: artifacts/release-notes.md
          files: |
            Releases/*.msi
            Releases/*.zip
            Releases/EasyChat-${{ env.VERSION }}-full.nupkg
            Releases/EasyChat-${{ env.VERSION }}-delta.nupkg
            Releases/RELEASES*
            Releases/assets.*.json
            Releases/releases.*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Portable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EasyChat-Portable
          path: |
            Releases/*.zip

      - name: Upload MSI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EasyChat-MSI
          path: |
            Releases/*.msi

      - name: Upload Velopack Assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Velopack-Assets
          path: |
            Releases/EasyChat-${{ env.VERSION }}-full.nupkg
            Releases/EasyChat-${{ env.VERSION }}-delta.nupkg
            Releases/RELEASES*
            Releases/assets.*.json
            Releases/releases.*.json
