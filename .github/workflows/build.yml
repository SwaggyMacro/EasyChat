name: Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get Short SHA
        id: vars
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Run tests
        continue-on-error: true
        run: dotnet test ./EasyChat.sln -c Release

      - name: Restore Windows dependencies
        run: dotnet restore ./src/Host/EasyChat.Desktop.Windows/EasyChat.Desktop.Windows.csproj -r win-x64

      - name: Publish EasyChat
        run: dotnet publish ./src/Host/EasyChat.Desktop.Windows/EasyChat.Desktop.Windows.csproj -c Release -r win-x64 --self-contained false --no-restore -o ./publish

      - name: Compress Build
        run: Compress-Archive -Path ./publish/* -DestinationPath ./EasyChat-Build-${{ steps.vars.outputs.SHORT_SHA }}.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyChat-Build-${{ steps.vars.outputs.SHORT_SHA }}
          path: ./EasyChat-Build-${{ steps.vars.outputs.SHORT_SHA }}.zip
